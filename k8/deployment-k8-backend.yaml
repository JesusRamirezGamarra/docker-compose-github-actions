apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: actions-cluster-jesusramirez 
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend-container
          image: jesusramirezgamarra/backend-k8:latest
          env:
            - name: DB_HOST
              value: mysql-service
            - name: DB_USER
              value: root
            - name: DB_PASSWORD
              value: rootpassword
            - name: DB_NAME
              value: users_db
          ports:
            - containerPort: 3000  
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: actions-cluster-jesusramirez 
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: LoadBalancer

    