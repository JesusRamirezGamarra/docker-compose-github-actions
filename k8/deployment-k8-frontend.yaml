apiVersion: app/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: actions-cluster-JesusRamirez
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend-container
          image: jesusramirezgamarra/frontend-k8:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: actions-cluster-JesusRamirez
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer