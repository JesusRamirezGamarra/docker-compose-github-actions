apiVersion: v1
kind: Namespace
metadata:
  name: actions-cluster-jesusramirez  

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: actions-cluster-jesusramirez  
spec:
  resources:
    requests:
      storage: 1Gi
  accesModes:
    - ReadWriteOnce
---
apiVersion: v1
kind: Deployment
metadata:
  name: mysql-deployment
  namespace: actions-cluster-jesusramirez  
spec:
  replicas : 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql-container
          image: mysql:5.7
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: rootpassword
            - name: MYSQL_DATABASE
              value: users_db
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: actions-cluster-jesusramirez  
spec:
  selector:
    app: mysql
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
  # type: ClusterIP

